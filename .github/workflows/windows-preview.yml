name: Windows development preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-preview:
    name: Build and verify Windows x64 preview
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build reproducible development binary
        env:
          GOFLAGS: -mod=readonly
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          go mod verify
          New-Item -ItemType Directory -Force build/preview | Out-Null
          go build -trimpath -buildvcs=true -o build/preview/asd-windows-amd64.exe ./cmd/asd
          if ($LASTEXITCODE -ne 0) { throw 'Preview build failed.' }
          $binary = 'build/preview/asd-windows-amd64.exe'
          $hash = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          $commit = (& git rev-parse HEAD).Trim()
          $manifest = [ordered]@{
            schema_version = 1
            commit = $commit
            os = 'windows'
            arch = 'amd64'
            go_version = (& go version)
            filename = 'asd-windows-amd64.exe'
            sha256 = $hash
            size_bytes = (Get-Item -LiteralPath $binary).Length
            psmux_version_required = '3.4.0'
            psmux_sha256_required = 'bbe825a30f7cddc91b043084049143a381aba5f7e9e36e4d0bb587e296d262ca'
            release_status = 'unsigned-development-preview-not-a-release'
            scope = 'No Windows Terminal IME/focus/attach acceptance or memory budget claim'
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath build/preview/manifest.json -Encoding utf8
          "$hash  asd-windows-amd64.exe" | Set-Content -LiteralPath build/preview/SHA256SUMS -Encoding ascii
          if ((Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) { throw 'Artifact hash changed.' }
      - name: Verify native backend before distributing preview
        env:
          GOFLAGS: -mod=readonly
        run: |
          $psmux = ./tools/ci/install-psmux.ps1
          ./tools/ci/windows.ps1 -PsmuxBinary $psmux -EvidenceDirectory build/preview-native-check
      - name: Upload unsigned development preview
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asd-windows-amd64-dev-${{ github.sha }}
          path: build/preview/
          if-no-files-found: error
          retention-days: 14
      - name: Upload native test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asd-preview-verification-${{ github.sha }}
          path: build/preview-native-check/
          if-no-files-found: warn
          retention-days: 14
