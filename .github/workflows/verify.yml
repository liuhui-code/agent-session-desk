name: Verify

on:
  push:
    branches: [main]
    paths: ['cmd/**', 'internal/**', 'go.mod', 'go.sum', '.gitattributes', 'tools/**', '.github/workflows/**']
  pull_request:
    paths: ['cmd/**', 'internal/**', 'go.mod', 'go.sum', '.gitattributes', 'tools/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-linux:
    name: Go checks (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify source and tests
        env:
          GOFLAGS: -mod=readonly
        run: |
          go mod verify
          go test -count=1 -timeout=5m ./...
          go test -race -count=1 -timeout=5m ./...
          go vet ./...
          python3 -B tools/test_catalog.py check --generated
          python3 -B -m unittest discover -s tools/ci -p 'test_*.py' -v

  native-windows:
    name: Native contracts and resources (Windows Server 2025)
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run native Windows checks with pinned psmux
        run: |
          $binary = ./tools/ci/install-psmux.ps1
          ./tools/ci/windows.ps1 -PsmuxBinary $binary
      - name: Measure short native Windows resource baseline
        run: |
          ./tools/ci/test-windows-process-metrics.ps1 -EvidencePath build/ci-windows/process-metrics-graph-results.json
          ./tools/ci/test-windows-fixture-journal.ps1
          $binary = ./tools/ci/install-psmux.ps1
          ./tools/ci/windows-resources.ps1 -PsmuxBinary $binary
      - name: Summarize resource observations
        if: always()
        run: |
          if (Test-Path build/ci-windows/resources/summary.json) {
            python -B tools/ci/summarize_resources.py build/ci-windows/resources
          }
      - name: Upload actual verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-native-evidence-${{ github.sha }}
          path: build/ci-windows/
          if-no-files-found: warn
          retention-days: 14
